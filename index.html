<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>박준섭의 공간</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; color: #334155; line-height: 1.5; }
        .page-container { width: 100%; max-width: 600px; margin: 0 auto; padding: 20px; }
        
        /* 간격 좁히기: 섹션 하단 마진을 줄임 */
        section { margin-bottom: 20px; }
        
        .hero { text-align: center; padding: 40px 10px; }
        h1 { font-size: 28px; color: #1e293b; margin-bottom: 10px; }
        
        .contact { background: #1e293b; color: #fff; padding: 30px 20px; border-radius: 12px; text-align: center; }
        .contact h2 { margin-bottom: 10px; }
        
        /* 모바일 최적화 그리드 */
        .links-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .link-btn { background: rgba(255,255,255,0.1); padding: 12px; border-radius: 8px; color: #fff; text-decoration: none; font-size: 14px; transition: 0.3s; }
        .link-btn:hover { background: rgba(255,255,255,0.2); }
        
        /* 하단 연락처 */
        .footer-contact { display: flex; justify-content: space-between; margin-top: 25px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.2); font-size: 13px; }
    </style>
</head>
<body>

<div class="page-container">
    <section class="hero">
        <h1>안녕하세요! 박준섭입니다.</h1>
        <p>스토리텔링과 마케팅으로 가치를 만듭니다.</p>
    </section>

    <section class="contact">
        <h2>함께 소통해요!</h2>
        <p style="font-size: 0.9em; opacity: 0.8;">다양한 채널에서 저의 콘텐츠와 일상을 만나보실 수 있습니다 :)</p>
        
        <div class="links-grid">
            <a href="https://www.youtube.com/@BONG_TOB" class="link-btn"><i class="fab fa-youtube"></i> 음악 채널</a>
            <a href="https://www.youtube.com/@Art_Ailookbook" class="link-btn"><i class="fab fa-youtube"></i> 룩북 채널</a>
            <a href="https://www.instagram.com/bongsik2ya" class="link-btn"><i class="fab fa-instagram"></i> Instagram</a>
            <a href="https://blog.naver.com/lovepjs8282" class="link-btn"><i class="fas fa-blog"></i> 네이버 블로그</a>
            <a href="https://www.tiktok.com/@lovepjs8282" class="link-btn"><i class="fab fa-tiktok"></i> TikTok</a>
        </div>

        <div class="footer-contact">
            <a href="mailto:lovepjs8282@naver.com" style="color:#fff; text-decoration:none;"><i class="fas fa-envelope"></i> 이메일</a>
            <a href="tel:010-5736-5157" style="color:#fff; text-decoration:none;"><i class="fas fa-phone"></i> 010-5736-5157</a>
        </div>
    </section>
</div>

</body>
</html>
