<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>박준섭의 공간</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Pretendard', sans-serif; background: #f8fafc; padding: 20px; }
        .page-container { max-width: 600px; margin: 0 auto; }
        
        /* 버튼 그리드 고정 */
        .links-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 12px; 
            margin-top: 20px; 
        }
        
        /* 버튼 크기 통일 및 줄바꿈 방지 */
        .link-btn { 
            background: #0f172a; 
            padding: 16px 10px; /* 좌우 패딩 조정 */
            border-radius: 12px; 
            text-decoration: none; 
            font-size: 14px; 
            font-weight: 700; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            gap: 8px;
            white-space: nowrap; /* 텍스트 줄바꿈 강제 방지 */
            overflow: hidden;    /* 넘치는 텍스트 숨김 */
        }
        
        /* 텍스트 크기를 살짝 줄여서 긴 글자도 한 줄에 들어가게 함 */
        @media (max-width: 400px) {
            .link-btn { font-size: 12px; }
        }

        .yt { color: #ff4d4d; }
        .ig { color: #ff66b3; }
        .nb { color: #2ecc71; }
        .tt { color: #ffffff; } 
    </style>
</head>
<body>

<div class="page-container">
    <!-- 생략: 헤로 섹션 동일 -->
    
    <section class="contact">
        <!-- 생략: 타이틀 동일 -->
        
        <div class="links-grid">
            <a href="https://www.youtube.com/@BONG_TOB" class="link-btn yt"><i class="fab fa-youtube"></i> 음악채널</a>
            <a href="https://www.youtube.com/@Art_Ailookbook" class="link-btn yt"><i class="fab fa-youtube"></i> 룩북채널</a>
            <a href="https://www.instagram.com/bongsik2ya" class="link-btn ig"><i class="fab fa-instagram"></i> Instagram</a>
            <a href="https://blog.naver.com/lovepjs8282" class="link-btn nb"><i class="fas fa-blog"></i> 네이버블로그</a>
            <a href="https://www.tiktok.com/@lovepjs8282" class="link-btn tt"><i class="fab fa-tiktok"></i> TikTok</a>
        </div>
    </section>
</div>
</body>
</html>
