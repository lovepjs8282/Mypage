    <style>
        /* Portfolio Styles */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Lato', sans-serif; background-color: #f8fafc; color: #334155; line-height: 1.6; }
        
        /* Container */
        .page-container { width: 100%; max-width: 1280px; margin: 0 auto; padding: 60px; }
        
        /* Typography */
        h1, h2, h3 { font-family: 'Poppins', sans-serif; color: #1e293b; }
        h1 { font-size: 30px; margin-bottom: 20px; }
        h2 { font-size: 20px; margin-bottom: 20px; }
        
        /* Sections */
        section { margin-bottom: 20px; }
        
        /* Hero Section */
        .hero { text-align: center; padding: 100px 0; }
        .hero p { font-size: 24px; color: #64748b; max-width: 800px; margin: 0 auto; }
        
        /* Projects Grid */
        .projects-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 40px; }
        .project-card { background: #fff; border-radius: 12px; padding: 40px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); transition: transform 0.3s ease; }
        .project-card:hover { transform: translateY(-10px); }
        .project-card h3 { color: #4f46e5; margin-bottom: 15px; }
        
        /* Contact Section */
        .contact { background: #1e293b; color: #f8fafc; padding: 80px; border-radius: 12px; text-align: center; }
        .contact h2 { color: #fff; }
        .contact a { color: #818cf8; text-decoration: none; font-weight: 700; font-size: 24px; }
        
        /* Utility */
        .btn { display: inline-block; padding: 15px 30px; background: #4f46e5; color: #fff; border-radius: 8px; text-decoration: none; margin-top: 30px; }
    </style>
</head>
