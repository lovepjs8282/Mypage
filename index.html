<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>박준섭의 공간</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Pretendard', sans-serif; 
            background: radial-gradient(circle at center, #ffffff 0%, #cbd5e1 100%); 
            color: #334155; 
            min-height: 100vh; 
            padding: 10px 20px; /* 상단 패딩을 20px로 대폭 줄임 */
        }
        
        .page-container { max-width: 600px; margin: 0 auto; }
        
        /* 헤더 영역 수정: padding-top을 줄여 전체를 더 위로 올림 */
        .hero { text-align: center; padding-top: 10px; margin-bottom: -55px; position: relative; z-index: 2; }
        
        /* 텍스트 영역: margin-top을 줄여 제목을 더 위로 올림 */
        .hero-text { margin-top: 0px; margin-bottom: 20px; }
        
        .hero-content { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-end; 
            width: 100%; 
            max-width: 550px; 
            margin: 0 auto; 
        }
        
        .hero img { width: 120px; height: auto; } 
        h1 { font-size: 24px; color: #0f172a; font-weight: 800; white-space: nowrap; }
        .hero-desc { font-size: 0.85em; white-space: nowrap; }
        
        .contact { 
            background: #1e293b; 
            color: #fff; 
            padding: 40px; 
            border-radius: 24px; 
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2); 
            text-align: center; 
            position: relative; 
            z-index: 1; 
        }
        
        .links-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 30px; }
        .link-btn { 
            background: #0f172a; padding: 16px 10px; border-radius: 12px; text-decoration: none; 
            font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center;
            gap: 8px; white-space: nowrap; border: 1px solid rgba(255,255,255,0.1);
        }
        .yt { color: #ff4d4d; }
        .ig { color: #ff66b3; }
        .nb { color: #2ecc71; }
        .tt { color: #ffffff; } 
        
        .footer-contact { 
            display: flex; justify-content: space-between; margin-top: 40px; 
            padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); 
            font-size: 13px; color: #94a3b8; 
        }
    </style>
</head>
<body>

<div class="page-container">
    <section class="hero">
        <!-- 텍스트 위치를 최상단으로 올림 -->
        <div class="hero-text">
            <h1>준섭이의 개인 채널</h1>
            <p class="hero-desc">(테스트 페이지입니다)</p>
        </div>
        <div class="hero-content">
            <img src="char1.png" alt="캐릭터1">
            <img src="char2.png" alt="캐릭터2">
        </div>
    </section>

    <section class="contact">
        <h2 style="margin-bottom: 10px;">함께 소통해요 :)</h2>
        <p style="opacity: 0.7; font-size: 0.9em;">다양한 채널에서 저의 콘텐츠와 일상을 만나보실 수 있습니다.</p>
        
        <div class="links-grid">
            <a href="https://www.youtube.com/@BONG_TOB" class="link-btn yt"><i class="fab fa-youtube"></i> 음악채널</a>
            <a href="https://www.youtube.com/@Art_Ailookbook" class="link-btn yt"><i class="fab fa-youtube"></i> 룩북채널</a>
            <a href="https://www.instagram.com/bongsik2ya" class="link-btn ig"><i class="fab fa-instagram"></i> Instagram</a>
            <a href="https://blog.naver.com/lovepjs8282" class="link-btn nb"><i class="fas fa-blog"></i> 네이버블로그</a>
            <a href="https://www.tiktok.com/@lovepjs8282" class="link-btn tt"><i class="fab fa-tiktok"></i> TikTok</a>
        </div>

        <div class="footer-contact">
            <a href="mailto:lovepjs8282@naver.com" style="color:#cbd5e1; text-decoration:none;"><i class="fas fa-envelope"></i> 이메일</a>
            <a href="tel:010-5736-5157" style="color:#cbd5e1; text-decoration:none;"><i class="fas fa-phone"></i> 010-5736-5157</a>
        </div>
    </section>
</div>

</body>
</html>
