<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>박준섭의 공간</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Pretendard', sans-serif; 
            background: radial-gradient(circle at center, #ffffff 0%, #cbd5e1 100%); 
            color: #334155; 
            min-height: 100vh; 
            padding: 20px; 
        }
        
        .page-container { max-width: 650px; margin: 0 auto; } /* 컨테이너 폭을 살짝 늘림 */
        
        .hero { text-align: center; padding-top: 60px; margin-bottom: 0px; position: relative; z-index: 2; }
        
        /* 텍스트 영역 */
        .hero-text { margin-bottom: -100px; }
        
        /* 캐릭터 간격을 확실히 벌림 */
        .hero-content { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-end; 
            width: 100%; 
            max-width: 600px; /* 캐릭터 컨테이너 폭 확장 */
            margin: 0 auto; 
            padding: 0 5px;
        }
        
        .hero img { width: 130px; height: auto; } /* 캐릭터 크기 조정 */
        h1 { font-size: 26px; color: #0f172a; font-weight: 800; white-space: nowrap; }
        .hero-desc { font-size: 0.9em; margin-top: 5px; }
        
        /* 박스 크기 확대 */
        .contact { 
            background: #1e293b; 
            color: #fff; 
            padding: 50px 40px; /* 상하 패딩 확대 */
            border-radius: 30px; 
            box-shadow: 0 25px 30px -10px rgba(0,0,0,0.3); 
            text-align: center; 
            position: relative; 
            z-index: 1; 
        }
        
        .links-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 35px; }
        .link-btn { 
            background: #0f172a; padding: 18px 15px; border-radius: 14px; text-decoration: none; 
            font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center;
            gap: 10px; border: 1px solid rgba(255,255,255,0.1);
        }
        
        .footer-contact { 
            display: flex; justify-content: space-between; margin-top: 50px; 
            padding-top: 25px; border-top: 1px solid rgba(255,255,255,0.1); 
            font-size: 14px; color: #94a3b8; 
        }
        
        /* 포인트 컬러 */
        .yt { color: #ff4d4d; } .ig { color: #ff66b3; } .nb { color: #2ecc71; } .tt { color: #ffffff; }
    </style>
</head>
<body>

<div class="page-container">
    <section class="hero">
        <div class="hero-text">
            <h1>궁금해요?</h1>
            <p class="hero-desc">(그럼 아래를 클릭)</p>
        </div>
        <div class="hero-content">
            <img src="char1.png" alt="캐릭터1">
            <img src="char2.png" alt="캐릭터2">
        </div>
    </section>

    <section class="contact">
        <h2 style="margin-bottom: 10px;">함께 소통해요 :)</h2>
        <p style="opacity: 0.8; font-size: 1em; margin-bottom: 20px;">다양한 채널에서 저의 콘텐츠와 일상을 만나보실 수 있습니다.</p>
        
        <div class="links-grid">
            <a href="https://www.youtube.com/@Art_Ailookbook" class="link-btn yt"><i class="fab fa-youtube"></i> 룩북채널</a>
            <a href="https://www.youtube.com/@BONG_TOB" class="link-btn yt"><i class="fab fa-youtube"></i> 음악채널</a>
            <a href="https://www.instagram.com/bongsik2ya" class="link-btn ig"><i class="fab fa-instagram"></i> Instagram</a>
            <a href="https://blog.naver.com/lovepjs8282" class="link-btn nb"><i class="fas fa-blog"></i> 네이버블로그</a>
            <a href="https://www.tiktok.com/@lovepjs8282" class="link-btn tt"><i class="fab fa-tiktok"></i> TikTok</a>
        </div>

        <div class="footer-contact">
            <a href="mailto:lovepjs8282@naver.com" style="color:#cbd5e1; text-decoration:none;"><i class="fas fa-envelope"></i> 이메일</a>
            <a href="tel:010-5736-5157" style="color:#cbd5e1; text-decoration:none;"><i class="fas fa-phone"></i> 전화하기</a>
        </div>
    </section>
</div>

</body>
</html>
